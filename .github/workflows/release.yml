# A v* tag releases this repository: the addons/arena_weapons zip, and with `pack` the
# pack zip that carries addons/arena_weapons (its code) with the weapons data, which a
# host mounts as an add-on overlay. The whole job is in modcommunity/dot-ci; its README
# says what the inputs are.
name: Release

on:
    push:
        tags: ['v*']

jobs:
    validate:
        uses: modcommunity/dot-ci/.github/workflows/validate.yml@v1
        with:
            suite-timeout: 900
        secrets:
            DEPS_TOKEN: ${{ secrets.DOT_DEPS_TOKEN }}

    release:
        needs: validate
        uses: modcommunity/dot-ci/.github/workflows/release.yml@v1
        permissions:
            contents: write
        with:
            pack: true
            pack-owned-addons: true
        secrets:
            DEPS_TOKEN: ${{ secrets.DOT_DEPS_TOKEN }}
